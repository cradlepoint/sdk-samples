<!DOCTYPE html>
<html>
<head>
  <title>Cradlepoint Installer</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="3">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%233a3a3a'/><rect x='7' y='18' width='4' height='7' rx='1' fill='%23fff'/><rect x='14' y='13' width='4' height='12' rx='1' fill='%23fff'/><rect x='21' y='8' width='4' height='17' rx='1' fill='%23fff'/></svg>">
  <link rel="stylesheet" href="w3.css">
  <link rel="stylesheet" href="w3-theme-blue-grey.css">
</head>
<body class="w3-content" style="max-width:1300px; background-color: #3b4146">
  <div class="w3-half w3-theme-d3 w3-container" style="height:700px">
    <div class="w3-padding-32 w3-theme-l3 w3-padding-large">
      <form class="w3-container w3-card w3-theme-l4 w3-padding-32" id="main_form">
        <fieldset>
        <legend><h3>Cellular Signal Monitor</h3></legend>
          RSSI: {{rssi}}<br>
          SINR: {{sinr}}<br>
          RSRP: {{rsrp}}<br>
          RSRQ: {{rsrq}}<br>
        </fieldset>
      </form>
    </div>
  </div>
</body>
</html>
